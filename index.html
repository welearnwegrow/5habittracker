<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
// Single-page app: #start / #edit → Starter, #collection → Collection, #about → About, anything else → Tracker.
const ROUTES = ['start', 'edit', 'collection', 'about'];
class Component extends DCLogic {
  read() { const h = (window.location.hash || '').replace('#', ''); return ROUTES.includes(h) ? h : 'track'; }
  state = { route: this.read() };
  componentDidMount() {
    this.onHash = () => { this.setState({ route: this.read() }); window.scrollTo(0, 0); };
    window.addEventListener('hashchange', this.onHash);
  }
  componentWillUnmount() { window.removeEventListener('hashchange', this.onHash); }
  renderVals() {
    const r = this.state.route;
    return { isStart: r === 'start' || r === 'edit', isTrack: r === 'track', isCollection: r === 'collection', isAbout: r === 'about', goAbout: () => { window.location.hash = 'about'; } };
  }
}
</script>
